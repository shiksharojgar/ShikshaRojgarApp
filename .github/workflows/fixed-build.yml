name: Build Fixed Shiksha Rojgar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Fixed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check fixed project ZIP
        run: |
          if [ ! -f "ShikshaRojgarApp-Colorful-Fixed-v2.zip" ]; then
            echo "ERROR: Fixed project ZIP not found!"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Fixed project ZIP found."

      - name: Extract fixed project
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "ShikshaRojgarApp-Colorful-Fixed-v2.zip" -d extracted

          echo "Project extracted."

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          test -d "$PROJECT_DIR/app"

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Using build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Using build.gradle"
          else
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Collect APK
        run: |
          rm -rf apk-output
          mkdir -p apk-output

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -exec cp {} apk-output/ \;

          echo "Generated APK:"
          ls -lh apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiksha-Rojgar-Fixed-APK
          path: apk-output/*.apk
          if-no-files-found: error
