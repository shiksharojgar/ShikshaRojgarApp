name: Build Shiksha Rojgar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Shiksha Rojgar APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          echo "--- Project files ---"
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json

      - name: Validate Gradle configuration
        run: gradle help --stacktrace --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --warning-mode all

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiksha-Rojgar-Fixed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
