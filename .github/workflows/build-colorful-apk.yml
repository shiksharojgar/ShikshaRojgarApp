name: Build Colorful Shiksha Rojgar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Latest Colorful App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest project ZIP
        run: |
          echo "Checking project ZIP..."

          if [ ! -f "ShikshaRojgarApp-Updated-Colorful-Final.zip" ]; then
            echo "ERROR: Latest colorful project ZIP not found."
            echo "ZIP files available:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Latest colorful project ZIP found."

      - name: Extract latest project
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "ShikshaRojgarApp-Updated-Colorful-Final.zip" -d extracted

          echo "Project extracted successfully."

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          echo "Checking Android project..."

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "Project verification successful."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "Building Shiksha Rojgar APK..."

          gradle assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Collect APK
        run: |
          mkdir -p apk-output

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -exec cp {} apk-output/ \;

          echo "Generated APK:"
          ls -lh apk-output

          if ! ls apk-output/*.apk >/dev/null 2>&1; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiksha-Rojgar-APK
          path: apk-output/*.apk
          if-no-files-found: error
