name: Build Shiksha Rojgar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Updated Android Project
        run: |
          mkdir -p extracted
          unzip -q ShikshaRojgar-Updated-Project-v2.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -type f -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set Java 17 compatibility
        run: |
          python3 - <<'PY'
          import os

          project = os.environ["PROJECT_DIR"]
          path = os.path.join(project, "app", "build.gradle")

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          block = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """

          if "sourceCompatibility JavaVersion.VERSION_17" not in text:
              text = text.replace(
                  "    defaultConfig {",
                  block + "\n    defaultConfig {"
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Java 17 compatibility configured")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          mkdir -p apk-output
          find "$PROJECT_DIR" -name "*.apk" -type f -exec cp {} apk-output/ \;
          echo "Generated APK files:"
          ls -lh apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiksha-Rojgar-APK
          path: apk-output/*.apk
