name: Build Shiksha Rojgar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q ShikshaRojgarApp-GitHub-Ready.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set Java and Kotlin JVM target to 17
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

          echo "Java and Kotlin JVM target set to 17"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          mkdir -p apk-output
          find "$PROJECT_DIR" -name "*.apk" -type f -exec cp {} apk-output/ \;
          ls -lh apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiksha-Rojgar-APK
          path: apk-output/*.apk
