
name: Deploy Shiksha Rojgar Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-hosting-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIKSHA_ROJGAR }}
          projectId: shiksha-rojgar
          entryPoint: ./firebase
          channelId: live
