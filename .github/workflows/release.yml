name: Build Signed Shiksha Rojgar Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SHIKSHA_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing GitHub secret SHIKSHA_KEYSTORE_B64' && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/shiksha-rojgar-release.jks"
          test -s "$RUNNER_TEMP/shiksha-rojgar-release.jks"

      - name: Build signed release APK
        env:
          SHIKSHA_KEYSTORE_FILE: ${{ runner.temp }}/shiksha-rojgar-release.jks
          SHIKSHA_KEYSTORE_PASSWORD: ${{ secrets.SHIKSHA_KEYSTORE_PASSWORD }}
          SHIKSHA_KEY_ALIAS: ${{ secrets.SHIKSHA_KEY_ALIAS }}
          SHIKSHA_KEY_PASSWORD: ${{ secrets.SHIKSHA_KEY_PASSWORD }}
        run: |
          test -n "$SHIKSHA_KEYSTORE_PASSWORD" || (echo 'Missing SHIKSHA_KEYSTORE_PASSWORD' && exit 1)
          test -n "$SHIKSHA_KEY_ALIAS" || (echo 'Missing SHIKSHA_KEY_ALIAS' && exit 1)
          test -n "$SHIKSHA_KEY_PASSWORD" || (echo 'Missing SHIKSHA_KEY_PASSWORD' && exit 1)
          gradle assembleRelease --stacktrace --no-daemon

      - name: Verify APK certificate
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiksha-Rojgar-${{ github.ref_name }}-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
