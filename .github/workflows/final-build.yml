name: Shiksha Rojgar APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Shiksha Rojgar ZIP..."

          ZIP_FILE=$(find . -type f \
            -name "ShikshaRojgarApp*.zip" \
            | sort -V \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ShikshaRojgarApp ZIP नहीं मिला।"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          echo "ZIP extracted."

          PROJECT_DIR=""

          if [ -f "extracted-project/settings.gradle" ] || \
             [ -f "extracted-project/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted-project"
          else
            SETTINGS_FILE=$(find extracted-project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: ZIP के अंदर Android Gradle project नहीं मिला।"
            echo "Found files:"
            find extracted-project -maxdepth 5 -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \)
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check signing secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          echo "Checking signing secrets..."

          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "ERROR: SIGNING_KEYSTORE_BASE64 missing"
            exit 1
          fi

          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "ERROR: SIGNING_STORE_PASSWORD missing"
            exit 1
          fi

          if [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "ERROR: SIGNING_KEY_ALIAS missing"
            exit 1
          fi

          echo "SIGNING_KEYSTORE_BASE64 : PRESENT"
          echo "SIGNING_STORE_PASSWORD  : PRESENT"
          echo "SIGNING_KEY_ALIAS       : PRESENT"

      - name: Decode permanent keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          echo "Decoding permanent keystore..."

          KEYSTORE_FILE="$RUNNER_TEMP/shiksharojgar-release.jks"

          printf '%s' "$SIGNING_KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            > "$RUNNER_TEMP/keystore.b64"

          BASE64_LENGTH=$(wc -c < "$RUNNER_TEMP/keystore.b64")

          echo "Base64 length: $BASE64_LENGTH"

          if [ "$BASE64_LENGTH" -eq 0 ]; then
            echo "ERROR: Base64 secret खाली है।"
            exit 1
          fi

          REMAINDER=$((BASE64_LENGTH % 4))

          if [ "$REMAINDER" -eq 1 ]; then
            echo "ERROR: Base64 secret truncated/corrupt है।"
            exit 1
          fi

          if [ "$REMAINDER" -eq 2 ]; then
            printf '==' >> "$RUNNER_TEMP/keystore.b64"
          elif [ "$REMAINDER" -eq 3 ]; then
            printf '=' >> "$RUNNER_TEMP/keystore.b64"
          fi

          base64 --decode \
            "$RUNNER_TEMP/keystore.b64" \
            > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore decode नहीं हुआ।"
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS"

          echo "Permanent keystore verified."

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Create signing configuration
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/permanent-signing.init.gradle" <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          signingConfigs {
                              permanentRelease {
                                  storeFile = new File(System.getenv("KEYSTORE_FILE"))
                                  storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                                  keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                                  keyPassword = System.getenv("SIGNING_STORE_PASSWORD")
                              }
                          }

                          buildTypes {
                              release {
                                  signingConfig = signingConfigs.permanentRelease
                              }
                          }
                      }
                  }
              }
          }
          EOF

          echo "Signing configuration created."

      - name: Build signed Release APK
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Release APK..."

          chmod +x gradlew

          ./gradlew \
            -I permanent-signing.init.gradle \
            clean \
            assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Find Release APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            \( -name "*-release.apk" -o -name "app-release.apk" \) \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK नहीं मिला।"
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "Release APK:"
          echo "$APK"

          cp "$APK" "$RUNNER_TEMP/ShikshaRojgar-release.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner नहीं मिला।"
            exit 1
          fi

          "$APKSIGNER" verify --verbose \
            "$RUNNER_TEMP/ShikshaRojgar-release.apk"

          echo "APK signature verification successful."

      - name: Show APK information
        shell: bash
        run: |
          echo "===================================="
          echo "FINAL APK"
          echo "===================================="

          ls -lh "$RUNNER_TEMP/ShikshaRojgar-release.apk"

          echo "SHA-256:"
          sha256sum "$RUNNER_TEMP/ShikshaRojgar-release.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaRojgar-Permanent-Signed-Release
          path: ${{ runner.temp }}/ShikshaRojgar-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/shiksharojgar-release.jks"
          rm -f "$RUNNER_TEMP/keystore.b64"
          rm -f "$PROJECT_DIR/permanent-signing.init.gradle"
