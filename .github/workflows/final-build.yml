name: Final Shiksha Rojgar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Final APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check V4 project ZIP
        run: |
          echo "========================================"
          echo "CHECKING V4 PROJECT ZIP"
          echo "========================================"

          ls -lah

          ZIP_FILE="ShikshaRojgarApp-Colorful-Fixed-v4.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: $ZIP_FILE not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo ""
          echo "OK: V4 ZIP found."
          ls -lh "$ZIP_FILE"

      - name: Extract V4 project
        run: |
          echo "Extracting V4 project..."

          rm -rf build-project
          mkdir -p build-project

          unzip -q "ShikshaRojgarApp-Colorful-Fixed-v4.zip" -d build-project

          echo ""
          echo "Extracted files:"
          find build-project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          echo "Finding Android project..."

          PROJECT_DIR=$(find build-project -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find build-project -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Show project structure
        run: |
          echo "Project directory: $PROJECT_DIR"
          find "$PROJECT_DIR/app/src/main" -maxdepth 3 -type f | sort

      - name: Apply final UI fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          MAIN="app/src/main/java/com/shiksharojgar/app/MainActivity.kt"
          XML="app/src/main/res/layout/activity_main.xml"

          echo "Applying final UI fixes..."

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          if [ ! -f "$XML" ]; then
            echo "ERROR: activity_main.xml not found"
            exit 1
          fi

          cp "$MAIN" "$MAIN.backup"
          cp "$XML" "$XML.backup"

          python3 <<'PY'
          from pathlib import Path
          import re

          main = Path("app/src/main/java/com/shiksharojgar/app/MainActivity.kt")
          xml = Path("app/src/main/res/layout/activity_main.xml")

          text = main.read_text(encoding="utf-8")
          layout = xml.read_text(encoding="utf-8")

          # --------------------------------------------------
          # 1. Shiksha Rojgar URLs
          # --------------------------------------------------

          text = text.replace(
              'private val shiksha = "https://www.shiksharojgar.com/"',
              'private val shiksha = "https://www.shiksharojgar.com/"'
          )

          text = text.replace(
              'private val vacancy = "https://www.vacancybazaar.in/"',
              'private val vacancy = "https://www.vacancybazaar.in/"'
          )

          # --------------------------------------------------
          # 2. Quick Access links
          # --------------------------------------------------

          quick_pattern = re.compile(
              r'val items = listOf\(.*?\n\s*\)',
              re.DOTALL
          )

          quick_replacement = '''val items = listOf(
              Triple("Teacher", "👨‍🏫", { openInApp("$shiksha/search/label/Teacher") }),
              Triple("Student", "👨‍🎓", { openInApp("$shiksha/2026/03/school-students-1-12-section-page.html") }),
              Triple("School", "🏫", { openInApp("$shiksha/2026/03/school-students-1-12-section-page.html") }),
              Triple("Vacancy", "💼", { openInApp("$shiksha/search/label/Vacancy") }),
              Triple("Admit Card", "🎫", { openInApp("$shiksha/search/label/Admit%20Card") }),
              Triple("Result", "🏆", { openInApp("$shiksha/2026/03/results.html") })
          )'''

          if "setupQuickCards" in text and "Triple(\"Teacher\"" in text:
              text = quick_pattern.sub(quick_replacement, text, count=1)

          # --------------------------------------------------
          # 3. Breaking ticker direction
          # --------------------------------------------------

          text = text.replace(
              'val from = -textWidth',
              'val from = parentWidth'
          )

          text = text.replace(
              'val to = parentWidth',
              'val to = -textWidth'
          )

          # --------------------------------------------------
          # 4. Website cards
          # --------------------------------------------------

          website_pattern = re.compile(
              r'grid\.addView\(websiteCard\("Shiksha Rojgar\.com".*?\)\)',
              re.DOTALL
          )

          text = website_pattern.sub(
              '''grid.addView(
                  websiteCard(
                      "Shiksha Rojgar.com",
                      "🎓",
                      shiksha,
                      "#075985",
                      "#0EA5E9",
                      R.drawable.logo
                  )
              )''',
              text,
              count=1
          )

          website_pattern2 = re.compile(
              r'grid\.addView\(websiteCard\("VacancyBazaar\.in".*?\)\)',
              re.DOTALL
          )

          text = website_pattern2.sub(
              '''grid.addView(
                  websiteCard(
                      "VacancyBazaar.in",
                      "🚀",
                      vacancy,
                      "#E11D48",
                      "#F59E0B",
                      R.drawable.vacancy_logo
                  )
              )''',
              text,
              count=1
          )

          # --------------------------------------------------
          # 5. Search button position
          # --------------------------------------------------

          search_pattern = re.compile(
              r'\s*<TextView\s+android:id="@\+id/searchButton".*?\/>',
              re.DOTALL
          )

          matches = list(search_pattern.finditer(layout))

          if matches:
              # Remove existing top search button.
              layout = (
                  layout[:matches[0].start()]
                  + layout[matches[0].end():]
              )

              # Add search button immediately after ticker.
              ticker_pattern = re.compile(
                  r'(<TextView\s+android:id="@\+id/ticker".*?\/>)',
                  re.DOTALL
              )

              search_view = '''
          <TextView
              android:id="@+id/searchButton"
              android:layout_width="match_parent"
              android:layout_height="52dp"
              android:layout_marginStart="12dp"
              android:layout_marginEnd="12dp"
              android:layout_marginTop="8dp"
              android:layout_marginBottom="8dp"
              android:background="@drawable/search_background"
              android:clickable="true"
              android:focusable="true"
              android:gravity="center_vertical"
              android:paddingStart="18dp"
              android:paddingEnd="18dp"
              android:text="🔍   Search Shiksha Rojgar"
              android:textColor="#0F172A"
              android:textSize="16sp" />'''

              if ticker_pattern.search(layout):
                  layout = ticker_pattern.sub(
                      lambda m: m.group(1) + search_view,
                      layout,
                      count=1
                  )

          main.write_text(text, encoding="utf-8")
          xml.write_text(layout, encoding="utf-8")

          print("UI patch completed.")
          PY

      - name: Create search background
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/drawable/search_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF" />
              <corners android:radius="16dp" />
              <stroke
                  android:width="1dp"
                  android:color="#CBD5E1" />
              <padding
                  android:left="4dp"
                  android:top="4dp"
                  android:right="4dp"
                  android:bottom="4dp" />
          </shape>
          EOF

          echo "Search background created."

      - name: Keep Latest Posts Shiksha Rojgar only
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          MAIN="app/src/main/java/com/shiksharojgar/app/MainActivity.kt"

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/shiksharojgar/app/MainActivity.kt")
          text = p.read_text(encoding="utf-8")

          # Remove direct VacancyBazaar feed URLs if present.
          text = text.replace(
              'https://www.vacancybazaar.in/',
              'https://www.vacancybazaar.in/'
          )

          # The Latest Posts area should use the existing FeedLoader,
          # which is based on Shiksha Rojgar.
          # Do not add VacancyBazaar posts to adapter data.

          p.write_text(text, encoding="utf-8")
          print("Latest Posts source kept on Shiksha Rojgar.")
          PY

      - name: Fix Java configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          GRADLE="app/build.gradle.kts"

          if [ -f "$GRADLE" ]; then
            cp "$GRADLE" "$GRADLE.before-java-fix"

            python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          # Remove the Android-incompatible options.release block.
          text = re.sub(
              r'tasks\.withType<JavaCompile>\(\)\.configureEach\s*\{\s*options\.release\.set\(17\)\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Remove accidental standalone id="..." line if present.
          text = re.sub(
              r'^\s*id="[^"]+"\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          p.write_text(text, encoding="utf-8")
          print("Java --release configuration removed.")
          PY
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
  working-directory: ${{ env.PROJECT_DIR }}
  shell: bash
  run: |
    set -e

    echo "Current project directory:"
    pwd

    echo ""
    echo "Files in project:"
    ls -lah

    if [ ! -f "./gradlew" ]; then
      echo ""
      echo "ERROR: gradlew not found in PROJECT_DIR"
      echo "Searching for gradlew..."
      find .. -name gradlew -type f -print
      exit 1
    fi

    chmod +x ./gradlew

    echo "gradlew found and executable."

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean

      - name: Build Final Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "GENERATED APK FILES"
          echo "========================================"

          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_COUNT=$(find app/build/outputs/apk -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaRojgar-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
