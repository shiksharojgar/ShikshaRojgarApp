name: Final Shiksha Rojgar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Final APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check V4 ZIP
        run: |
          set -e

          echo "========================================"
          echo "CHECKING PROJECT ZIP"
          echo "========================================"

          ls -lah

          ZIP_FILE="ShikshaRojgarApp-Colorful-Fixed-v4.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found:"
            echo "$ZIP_FILE"
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "$ZIP_FILE"

      - name: Extract project
        run: |
          set -e

          rm -rf build-project
          mkdir -p build-project

          unzip -q "ShikshaRojgarApp-Colorful-Fixed-v4.zip" -d build-project

          echo "========================================"
          echo "EXTRACTED PROJECT"
          echo "========================================"

          find build-project -maxdepth 3 -type f | sort | head -150

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR GRADLE PROJECT"
          echo "========================================"

          GRADLEW=$(find build-project -type f -name "gradlew" | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside ZIP."
            echo ""
            echo "Searching all files:"
            find build-project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "GRADLEW FOUND:"
          echo "$GRADLEW"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          pwd
          ls -lah

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \( \
            -name "gradlew" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print

      - name: Apply UI fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          MAIN="app/src/main/java/com/shiksharojgar/app/MainActivity.kt"
          XML="app/src/main/res/layout/activity_main.xml"

          echo "========================================"
          echo "APPLYING UI FIXES"
          echo "========================================"

          if [ ! -f "$MAIN" ]; then
            echo "WARNING: MainActivity.kt not found."
          else
            cp "$MAIN" "$MAIN.backup"

            python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/shiksharojgar/app/MainActivity.kt")

          text = p.read_text(encoding="utf-8")

          # Breaking ticker: Right -> Left
          text = text.replace(
              "val from = -textWidth",
              "val from = parentWidth"
          )

          text = text.replace(
              "val to = parentWidth",
              "val to = -textWidth"
          )

          p.write_text(text, encoding="utf-8")

          print("Ticker direction fixed: Right -> Left")
          PY
          fi

          if [ ! -f "$XML" ]; then
            echo "WARNING: activity_main.xml not found."
          else
            cp "$XML" "$XML.backup"
          fi

      - name: Create search background
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/drawable/search_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">

              <solid android:color="#FFFFFF" />

              <corners android:radius="16dp" />

              <stroke
                  android:width="1dp"
                  android:color="#CBD5E1" />

              <padding
                  android:left="4dp"
                  android:top="4dp"
                  android:right="4dp"
                  android:bottom="4dp" />

          </shape>
          EOF

          echo "Search background created."

      - name: Fix Java configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          GRADLE_FILE="app/build.gradle.kts"

          if [ -f "$GRADLE_FILE" ]; then

            cp "$GRADLE_FILE" "$GRADLE_FILE.backup"

            python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")

          text = p.read_text(encoding="utf-8")

          # Remove Android-incompatible JavaCompile --release configuration.
          text = re.sub(
              r'tasks\.withType<JavaCompile>\(\)\.configureEach\s*\{.*?options\.release\.set\(17\).*?\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Remove accidental standalone id="..." lines.
          text = re.sub(
              r'^\s*id="[^"]+"\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          p.write_text(text, encoding="utf-8")

          print("Java configuration fixed.")
          PY

          else
            echo "WARNING: app/build.gradle.kts not found."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING GRADLE"
          echo "========================================"

          pwd
          ls -lah

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew is not in project directory."
            echo ""
            echo "Searching:"
            find .. -name "gradlew" -type f -print
            exit 1
          fi

          chmod +x ./gradlew

          echo "gradlew is ready."

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          ./gradlew clean

      - name: Build Final Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GENERATED APK"
          echo "========================================"

          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_COUNT=$(find app/build/outputs/apk -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK GENERATED SUCCESSFULLY."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaRojgar-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
