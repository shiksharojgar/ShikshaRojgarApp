      - name: Deploy Firestore Rules + Hosting
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        continue-on-error: true

        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Firebase service account missing."
            echo "Skipping Firebase Rules/Hosting deployment."
            exit 0
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" \
            > "$RUNNER_TEMP/firebase-service-account.json"

          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"

          npm install --global firebase-tools

          cd "$PROJECT_DIR/firebase"

          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:rules,hosting \
            --non-interactive \
            || echo "Firebase Rules/Hosting deployment failed or permission is unavailable. APK build remains successful."

          echo "Firebase deployment step completed."
