name: Final Shiksha Rojgar APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Final APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Check existing V4 ZIP
      # ---------------------------------------------------------
      - name: Check V4 project ZIP
        run: |
          echo "Repository files:"
          ls -lah

          if [ ! -f "ShikshaRojgarApp-Colorful-Fixed-v4.zip" ]; then
            echo "ERROR: ShikshaRojgarApp-Colorful-Fixed-v4.zip not found."
            exit 1
          fi

          echo "V4 ZIP found successfully."


      # ---------------------------------------------------------
      # 3. Extract V4 ZIP
      # ---------------------------------------------------------
      - name: Extract V4 project
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q "ShikshaRojgarApp-Colorful-Fixed-v4.zip" -d build-project

          echo "Extracted files:"
          find build-project -maxdepth 4 -type f | sort | head -150


      # ---------------------------------------------------------
      # 4. Find Android project
      # ---------------------------------------------------------
      - name: Find Android project
        run: |
          PROJECT_DIR=""

          if [ -f "$GITHUB_WORKSPACE/build-project/ShikshaRojgarApp/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/build-project/ShikshaRojgarApp"

          elif [ -f "$GITHUB_WORKSPACE/build-project/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/build-project"

          else
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build-project" \
              -name settings.gradle.kts \
              -o -name settings.gradle \
              | head -1 \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"


      # ---------------------------------------------------------
      # 5. Patch Java configuration
      # ---------------------------------------------------------
      - name: Fix Android Java configuration
        run: |
          python3 - <<'PY'
          import os
          import re

          project = os.environ["PROJECT_DIR"]
          path = os.path.join(project, "app", "build.gradle.kts")

          if not os.path.exists(path):
              print("ERROR: app/build.gradle.kts not found.")
              raise SystemExit(1)

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove unsupported Android Gradle Plugin Java --release block.
          text = re.sub(
              r'(?ms)^\s*tasks\.withType<JavaCompile>\(\)\.configureEach\s*\{\s*'
              r'options\.release\.set\(17\)\s*'
              r'\}\s*',
              '',
              text
          )

          # Safety fallback.
          text = re.sub(
              r'^\s*options\.release\.set\(17\)\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Java configuration fixed.")
          print(
              "options.release.set(17) present:",
              "options.release.set(17)" in text
          )


      # ---------------------------------------------------------
      # 6. Patch MainActivity
      # ---------------------------------------------------------
      - name: Apply Shiksha Rojgar UI fixes
        run: |
          python3 - <<'PY'
          import os
          import re

          project = os.environ["PROJECT_DIR"]

          candidates = [
              os.path.join(
                  project,
                  "app",
                  "src",
                  "main",
                  "java",
                  "com",
                  "shiksharojgar",
                  "app",
                  "MainActivity.kt"
              )
          ]

          main_file = None

          for p in candidates:
              if os.path.exists(p):
                  main_file = p
                  break

          if main_file is None:
              found = []
              for root, dirs, files in os.walk(project):
                  if "MainActivity.kt" in files:
                      found.append(os.path.join(root, "MainActivity.kt"))

              if found:
                  main_file = found[0]

          if main_file is None:
              print("WARNING: MainActivity.kt not found.")
              print("Skipping UI patch.")
              raise SystemExit(0)

          print("Patching:", main_file)

          with open(main_file, "r", encoding="utf-8") as f:
              text = f.read()


          # -------------------------------------------------------
          # A. Breaking ticker direction
          #
          # Change LEFT -> RIGHT animation into RIGHT -> LEFT.
          # -------------------------------------------------------

          replacements = [
              (
                  "from = -textWidth",
                  "from = parentWidth"
              ),
              (
                  "to = parentWidth",
                  "to = -textWidth"
              ),
              (
                  "from = 0f",
                  "from = parentWidth.toFloat()"
              )
          ]

          for old, new in replacements:
              text = text.replace(old, new)


          # -------------------------------------------------------
          # B. Search placement
          #
          # Hide/remove the top search button/icon where the source
          # contains common search identifiers.
          # -------------------------------------------------------

          search_patterns = [
              r'^\s*searchButton\.visibility\s*=.*$',
              r'^\s*searchView\.visibility\s*=.*$',
              r'^\s*searchIcon\.visibility\s*=.*$'
          ]

          for pattern in search_patterns:
              text = re.sub(
                  pattern,
                  '        // Search moved away from the top header.',
                  text,
                  flags=re.MULTILINE
              )


          # -------------------------------------------------------
          # C. Shiksha Rojgar menu URLs
          #
          # Current official site navigation contains:
          # Latest Jobs / Result / Admit Card / School / Teacher.
          # -------------------------------------------------------

          url_map = {
              "TEACHER_URL":
                  "https://www.shiksharojgar.com/search/label/Teacher",

              "STUDENT_URL":
                  "https://www.shiksharojgar.com/2026/03/College%20%20University%20Students.html",

              "SCHOOL_URL":
                  "https://www.shiksharojgar.com/2026/03/school-students-1-12-section-page.html",

              "RESULT_URL":
                  "https://www.shiksharojgar.com/2026/03/results.html",

              "ADMIT_CARD_URL":
                  "https://www.shiksharojgar.com/search/label/Admit%20Card",

              "VACANCY_URL":
                  "https://www.shiksharojgar.com/"
          }


          # -------------------------------------------------------
          # D. Replace old hard-coded label URLs when they occur.
          # -------------------------------------------------------

          text = text.replace(
              'https://www.shiksharojgar.com/search/label/Teacher',
              url_map["TEACHER_URL"]
          )

          text = re.sub(
              r'https://www\.shiksharojgar\.com/search/label/Student',
              url_map["STUDENT_URL"],
              text,
              flags=re.IGNORECASE
          )

          text = re.sub(
              r'https://www\.shiksharojgar\.com/search/label/School',
              url_map["SCHOOL_URL"],
              text,
              flags=re.IGNORECASE
          )

          text = re.sub(
              r'https://www\.shiksharojgar\.com/search/label/Result',
              url_map["RESULT_URL"],
              text,
              flags=re.IGNORECASE
          )

          text = re.sub(
              r'https://www\.shiksharojgar\.com/search/label/Admit%20Card',
              url_map["ADMIT_CARD_URL"],
              text,
              flags=re.IGNORECASE
          )


          # -------------------------------------------------------
          # E. Prevent Vacancy quick button from opening
          #    VacancyBazaar.
          # -------------------------------------------------------

          text = text.replace(
              'https://www.vacancybazaar.in/',
              'https://www.shiksharojgar.com/'
          )


          with open(main_file, "w", encoding="utf-8") as f:
              f.write(text)

          print("MainActivity patch completed.")
          PY


      # ---------------------------------------------------------
      # 7. Make Latest Posts Shiksha Rojgar only
      # ---------------------------------------------------------
      - name: Make feed Shiksha Rojgar only
        run: |
          python3 - <<'PY'
          import os

          project = os.environ["PROJECT_DIR"]

          found = []

          for root, dirs, files in os.walk(project):
              for name in files:
                  if name == "FeedLoader.kt":
                      found.append(os.path.join(root, name))

          if not found:
              print("WARNING: FeedLoader.kt not found.")
              raise SystemExit(0)

          path = found[0]

          print("Patching feed loader:", path)

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Keep Shiksha Rojgar feed.
          # Remove/disable VacancyBazaar feed URL.
          text = text.replace(
              'https://www.vacancybazaar.in/feeds/posts/default?alt=rss&max-results=12',
              ''
          )

          text = text.replace(
              'https://www.vacancybazaar.in/feeds/posts/default',
              ''
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Latest Posts feed patched.")
          PY


      # ---------------------------------------------------------
      # 8. Patch website OPEN buttons
      # ---------------------------------------------------------
      - name: Fix website OPEN buttons
        run: |
          python3 - <<'PY'
          import os
          import re

          project = os.environ["PROJECT_DIR"]

          layouts = []

          for root, dirs, files in os.walk(project):
              for name in files:
                  if name.endswith(".xml"):
                      layouts.append(os.path.join(root, name))

          for path in layouts:
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      text = f.read()
              except:
                  continue

              original = text

              # Make website card containers horizontal where possible.
              if "Shiksha Rojgar.com" in text or "VacancyBazaar.in" in text:
                  text = text.replace(
                      'android:orientation="vertical"',
                      'android:orientation="horizontal"',
                      1
                  )

              if text != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(text)

                  print("Updated website layout:", path)
          PY


      # ---------------------------------------------------------
      # 9. Verify important URLs / configuration
      # ---------------------------------------------------------
      - name: Verify final source configuration
        run: |
          echo "========================================"
          echo "FINAL SOURCE CHECK"
          echo "========================================"

          echo ""
          echo "Searching source files..."

          grep -Rni \
            -E \
            "shiksharojgar.com|vacancybazaar.in|options.release|from =|to =" \
            "$PROJECT_DIR/app/src/main" \
            || true

          echo ""
          echo "Checking unsupported Java release..."

          if grep -R "options.release.set(17)" \
             "$PROJECT_DIR/app/src/main" \
             "$PROJECT_DIR/app/build.gradle.kts"; then

            echo "ERROR: options.release.set(17) still exists."
            exit 1
          else
            echo "OK: options.release.set(17) not found."
          fi


      # ---------------------------------------------------------
      # 10. Setup JDK 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 11. Setup Gradle 8.9
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ---------------------------------------------------------
      # 12. Show versions
      # ---------------------------------------------------------
      - name: Show build environment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Build configuration:"
          sed -n '1,240p' app/build.gradle.kts


      # ---------------------------------------------------------
      # 13. Clean
      # ---------------------------------------------------------
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean --no-daemon


      # ---------------------------------------------------------
      # 14. Build APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace


      # ---------------------------------------------------------
      # 15. Verify APK
      # ---------------------------------------------------------
      - name: Check generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Generated APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"
          echo "$APK"
          ls -lh "$APK"


      # ---------------------------------------------------------
      # 16. Upload APK
      # ---------------------------------------------------------
      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiksha-Rojgar-FINAL-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
