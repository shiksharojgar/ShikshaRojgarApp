name: Final Shiksha Rojgar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Final APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. CHECK V4 ZIP
      # ============================================================
      - name: Check V4 project ZIP
        run: |
          echo "========================================"
          echo "CHECKING V4 PROJECT ZIP"
          echo "========================================"

          ls -lah

          if [ ! -f "ShiksharojgarApp-Colorful-Fixed-v4.zip" ]; then
            echo ""
            echo "ERROR: ShiksharojgarApp-Colorful-Fixed-v4.zip not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo ""
          echo "OK: V4 ZIP found."
          ls -lh "ShiksharojgarApp-Colorful-Fixed-v4.zip"


      # ============================================================
      # 3. EXTRACT ZIP
      # ============================================================
      - name: Extract V4 project
        run: |
          echo "========================================"
          echo "EXTRACTING V4 PROJECT"
          echo "========================================"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "ShiksharojgarApp-Colorful-Fixed-v4.zip" -d build-project

          echo ""
          echo "Extracted project files:"
          find build-project -maxdepth 5 -type f | sort | head -200


      # ============================================================
      # 4. FIND ANDROID PROJECT
      # ============================================================
      - name: Find Android project
        run: |
          echo "========================================"
          echo "FINDING ANDROID PROJECT"
          echo "========================================"

          PROJECT_DIR=""

          if [ -f "$GITHUB_WORKSPACE/build-project/ShiksharojgarApp/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/build-project/ShiksharojgarApp"

          elif [ -f "$GITHUB_WORKSPACE/build-project/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/build-project"

          else
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build-project" \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -print \
              | head -1 \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 5. FIX JAVA 17 CONFIGURATION
      # ============================================================
      - name: Fix Android Java configuration
        run: |
          python3 - <<'PY'
          import os
          import re

          project = os.environ["PROJECT_DIR"]
          path = os.path.join(project, "app", "build.gradle.kts")

          if not os.path.exists(path):
              print("ERROR: app/build.gradle.kts not found.")
              raise SystemExit(1)

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove unsupported Android Gradle Plugin release setting.
          text = re.sub(
              r'(?ms)^\s*tasks\.withType<JavaCompile>\(\)\.configureEach\s*\{\s*'
              r'options\.release\.set\(17\)\s*'
              r'\}\s*',
              '\n',
              text
          )

          text = re.sub(
              r'^\s*options\.release\.set\(17\)\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Java configuration fixed.")
          print(
              "options.release.set(17) present:",
              "options.release.set(17)" in text
          )
          PY


      # ============================================================
      # 6. PATCH MAIN ACTIVITY
      # ============================================================
      - name: Apply final Shiksha Rojgar UI fixes
        run: |
          python3 - <<'PY'
          import os
          import re

          project = os.environ["PROJECT_DIR"]

          main_file = None

          for root, dirs, files in os.walk(project):
              if "MainActivity.kt" in files:
                  main_file = os.path.join(root, "MainActivity.kt")
                  break

          if main_file is None:
              print("ERROR: MainActivity.kt not found.")
              raise SystemExit(1)

          print("Patching:")
          print(main_file)

          with open(main_file, "r", encoding="utf-8") as f:
              text = f.read()


          # ========================================================
          # A. BREAKING NEWS RIGHT -> LEFT
          # ========================================================

          text = text.replace(
              "val from = -textWidth",
              "val from = parentWidth"
          )

          text = text.replace(
              "val to = parentWidth",
              "val to = -textWidth"
          )

          text = text.replace(
              "duration = 11000L",
              "duration = 12000L"
          )


          # ========================================================
          # B. SEARCH BUTTON
          #
          # Search is handled by the Activity after the title bar.
          # Do NOT remove the search functionality.
          # ========================================================

          # Keep existing search listener if present.
          # We only prevent code from hiding it permanently.

          text = re.sub(
              r'^\s*searchButton\.visibility\s*=\s*View\.GONE\s*$',
              '        // Search is displayed below the title bar.',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*searchButton\.visibility\s*=\s*View\.INVISIBLE\s*$',
              '        // Search is displayed below the title bar.',
              text,
              flags=re.MULTILINE
          )


          # ========================================================
          # C. ALL QUICK ACCESS URLS -> SHIKSHA ROJGAR
          # ========================================================

          url_map = {
              "TEACHER_URL":
                  "https://www.shiksharojgar.com/search/label/Teacher",

              "STUDENT_URL":
                  "https://www.shiksharojgar.com/2026/03/College%20%20University%20Students.html",

              "SCHOOL_URL":
                  "https://www.shiksharojgar.com/2026/03/school-students-1-12-section-page.html",

              "RESULT_URL":
                  "https://www.shiksharojgar.com/2026/03/results.html",

              "ADMIT_CARD_URL":
                  "https://www.shiksharojgar.com/search/label/Admit%20Card",

              "VACANCY_URL":
                  "https://www.shiksharojgar.com/search/label/Vacancy"
          }


          # Old Teacher URL
          text = text.replace(
              "https://www.shiksharojgar.com/2026/03/teacher-govt-employees.html",
              url_map["TEACHER_URL"]
          )


          # Old Student URL
          text = re.sub(
              r'https://www\.shiksharojgar\.com/2026/03/Student-section\.html',
              url_map["STUDENT_URL"],
              text,
              flags=re.IGNORECASE
          )


          # Old School URL
          text = re.sub(
              r'https://www\.shiksharojgar\.com/2026/03/school-students-1-12-section-page\.html',
              url_map["SCHOOL_URL"],
              text,
              flags=re.IGNORECASE
          )


          # Old Result URL
          text = re.sub(
              r'https://www\.shiksharojgar\.com/2026/03/results\.html',
              url_map["RESULT_URL"],
              text,
              flags=re.IGNORECASE
          )


          # Old Admit Card URL
          text = re.sub(
              r'https://www\.shiksharojgar\.com/2026/01/admit-card-download-zone\.html',
              url_map["ADMIT_CARD_URL"],
              text,
              flags=re.IGNORECASE
          )


          # VacancyBazaar URL must not be used for Quick Access.
          text = text.replace(
              "https://www.vacancybazaar.in/",
              "https://www.shiksharojgar.com/"
          )


          # ========================================================
          # D. REPLACE websiteCard FUNCTION
          #
          # Creates:
          #
          # LEFT  = logo + website name
          # RIGHT = separate OPEN button
          # ========================================================

          new_website_card = r'''
          private fun websiteCard(
              label: String,
              emoji: String,
              url: String,
              startColor: String,
              endColor: String,
              logoRes: Int
          ): LinearLayout {

              return LinearLayout(this).apply {

                  orientation = LinearLayout.HORIZONTAL

                  gravity = Gravity.CENTER_VERTICAL

                  setPadding(16, 12, 10, 12)

                  background = GradientDrawable(
                      GradientDrawable.Orientation.LEFT_RIGHT,
                      intArrayOf(
                          Color.parseColor(startColor),
                          Color.parseColor(endColor)
                      )
                  ).apply {
                      cornerRadius = 22f
                  }

                  val logo = ImageView(this@MainActivity).apply {
                      setImageResource(logoRes)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                  }

                  addView(
                      logo,
                      LinearLayout.LayoutParams(
                          54,
                          54
                      ).apply {
                          rightMargin = 12
                      }
                  )


                  val name = TextView(this@MainActivity).apply {
                      text = "$emoji  $label"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER_VERTICAL
                      setTypeface(typeface, android.graphics.Typeface.BOLD)
                  }

                  addView(
                      name,
                      LinearLayout.LayoutParams(
                          0,
                          60,
                          1f
                      )
                  )


                  val openButton = TextView(this@MainActivity).apply {

                      text = "OPEN  ↗"

                      textSize = 13f

                      setTextColor(Color.WHITE)

                      gravity = Gravity.CENTER

                      setPadding(
                          18,
                          0,
                          18,
                          0
                      )

                      background = GradientDrawable().apply {

                          setColor(
                              Color.argb(
                                  65,
                                  255,
                                  255,
                                  255
                              )
                          )

                          cornerRadius = 18f

                          setStroke(
                              1,
                              Color.argb(
                                  180,
                                  255,
                                  255,
                                  255
                              )
                          )
                      }

                      setTypeface(
                          typeface,
                          android.graphics.Typeface.BOLD
                      )

                      setOnClickListener {
                          openInApp(url)
                      }
                  }


                  addView(
                      openButton,
                      LinearLayout.LayoutParams(
                          105,
                          48
                      )
                  )


                  setOnClickListener {
                      openInApp(url)
                  }
              }
          }
          '''


          # Replace existing websiteCard function.
          pattern = re.compile(
              r'(?s)private fun websiteCard\(.*?(?=\n\s*private fun|\n\})'
          )

          match = pattern.search(text)

          if match:
              text = (
                  text[:match.start()]
                  + new_website_card.strip()
                  + "\n\n"
                  + text[match.end():]
              )
              print("websiteCard() replaced.")
          else:
              print("WARNING: Existing websiteCard() not found.")


          # ========================================================
          # E. WEBSITE ORDER
          # ========================================================

          # Ensure Shiksha Rojgar is before VacancyBazaar.
          old_vacancy = (
              'grid.addView(websiteCard("VacancyBazaar.in"'
          )

          if old_vacancy in text:
              print("VacancyBazaar website card found.")


          # ========================================================
          # SAVE
          # ========================================================

          with open(main_file, "w", encoding="utf-8") as f:
              f.write(text)

          print("")
          print("MainActivity final patch completed.")
          PY


      # ============================================================
      # 7. MAKE LATEST POSTS SHIKSHA ROJGAR ONLY
      # ============================================================
      - name: Make Latest Posts Shiksha Rojgar only
        run: |
          python3 - <<'PY'
          import os
          import re

          project = os.environ["PROJECT_DIR"]

          found = []

          for root, dirs, files in os.walk(project):
              if "FeedLoader.kt" in files:
                  found.append(
                      os.path.join(root, "FeedLoader.kt")
                  )

          if not found:
              print("ERROR: FeedLoader.kt not found.")
              raise SystemExit(1)

          path = found[0]

          print("Patching:")
          print(path)

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()


          # Remove VacancyBazaar fetch block.
          text = re.sub(
              r'(?ms)^\s*try\s*\{\s*'
              r'all\s*\+=\s*fetch\(\s*'
              r'"https://www\.vacancybazaar\.in/feeds/posts/default[^"]*"'
              r'\s*,\s*"VacancyBazaar"\s*\)\s*'
              r'\}\s*catch\s*\(_:\s*Exception\)\s*\{\s*\}',
              '',
              text
          )


          # Remove remaining VacancyBazaar feed references.
          text = text.replace(
              "https://www.vacancybazaar.in/feeds/posts/default?alt=rss&max-results=12",
              ""
          )

          text = text.replace(
              "https://www.vacancybazaar.in/feeds/posts/default",
              ""
          )


          # Ensure Shiksha Rojgar feed exists.
          if "https://www.shiksharojgar.com/feeds/posts/default" not in text:
              print(
                  "WARNING: Shiksha Rojgar feed URL not detected."
              )


          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Latest Posts = Shiksha Rojgar only.")
          PY


      # ============================================================
      # 8. PATCH XML SEARCH POSITION
      #
      # Search button is removed from topBar and inserted
      # immediately below ticker.
      # ============================================================
      - name: Move Search below title bar
        run: |
          python3 - <<'PY'
          import os
          import re

          project = os.environ["PROJECT_DIR"]

          xml_file = None

          for root, dirs, files in os.walk(project):
              if "activity_main.xml" in files:
                  xml_file = os.path.join(root, "activity_main.xml")
                  break

          if xml_file is None:
              print("WARNING: activity_main.xml not found.")
              raise SystemExit(0)

          print("Patching:")
          print(xml_file)

          with open(xml_file, "r", encoding="utf-8") as f:
              text = f.read()


          # --------------------------------------------------------
          # Find searchButton TextView.
          # --------------------------------------------------------

          search_pattern = re.compile(
              r'\s*<TextView\b'
              r'(?=[^>]*android:id="@\+id/searchButton")'
              r'[^>]*/>',
              re.MULTILINE
          )

          search_match = search_pattern.search(text)

          search_xml = '''
              <TextView
                  android:id="@+id/searchButton"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:layout_marginStart="16dp"
                  android:layout_marginTop="10dp"
                  android:layout_marginEnd="16dp"
                  android:layout_marginBottom="10dp"
                  android:background="@drawable/search_background"
                  android:gravity="center_vertical"
                  android:paddingStart="18dp"
                  android:paddingEnd="18dp"
                  android:text="🔍  Search Shiksha Rojgar"
                  android:textColor="#555555"
                  android:textSize="15sp" />
          '''


          # --------------------------------------------------------
          # If searchButton exists in topBar, remove it.
          # --------------------------------------------------------

          if search_match:
              text = (
                  text[:search_match.start()]
                  + "\n"
                  + text[search_match.end():]
              )
              print("Removed old Search button position.")
          else:
              print(
                  "Old searchButton XML not found; "
                  "continuing safely."
              )


          # --------------------------------------------------------
          # Insert Search after ticker.
          #
          # Finds the ticker TextView and inserts search after it.
          # --------------------------------------------------------

          ticker_pattern = re.compile(
              r'(?s)(<TextView\b'
              r'(?=[^>]*android:id="@\+id/ticker")'
              r'[^>]*'
              r'(?:/>|>.*?</TextView>))'
          )

          ticker_match = ticker_pattern.search(text)

          if ticker_match:
              insert_at = ticker_match.end()

              text = (
                  text[:insert_at]
                  + "\n"
                  + search_xml.strip()
                  + "\n"
                  + text[insert_at:]
              )

              print(
                  "Search button moved below ticker/title area."
              )
   
