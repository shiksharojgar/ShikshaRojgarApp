name: Shiksha Rojgar APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Shiksha Rojgar APK
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "8.9"

    steps:

      # --------------------------------------------------
      # 1. Repository Checkout
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 3. Gradle 8.9
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # --------------------------------------------------
      # 4. Find Project ZIP
      # --------------------------------------------------
      - name: Find Project ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking repository ZIP files..."
          echo "======================================"

          find . -maxdepth 2 -type f -iname "*.zip" -print

          ZIP_FILE=""

          # सबसे पहले v1.4 final ZIP खोजें
          if [ -f "./ShikshaRojgarApp-v1.4.0-final.zip" ]; then
            ZIP_FILE="./ShikshaRojgarApp-v1.4.0-final.zip"
          fi

          # अगर नाम बदल गया हो तो कोई भी ShikshaRojgarApp ZIP लें
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f \
              -iname "ShikshaRojgarApp*.zip" \
              ! -iname "*.apk.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Shiksha Rojgar project ZIP नहीं मिली।"
            echo ""
            echo "Repository में उपलब्ध ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo ""
          echo "Selected ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 5. Extract Project
      # --------------------------------------------------
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d android-project

          echo ""
          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | head -100

      # --------------------------------------------------
      # 6. Locate Actual Android Project
      # --------------------------------------------------
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Android project नहीं मिला।"
            echo ""
            echo "settings.gradle files:"
            find android-project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \
            \) -print || true
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo ""
          echo "Android Project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 7. Fix Java release option
      # --------------------------------------------------
      - name: Fix Android Java Configuration
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ -f "$BUILD_FILE" ]; then

            echo "Checking:"
            echo "$BUILD_FILE"

            # Problematic release option हटाएं
            sed -i '/options\.release\.set(17)/d' "$BUILD_FILE"

            # किसी पुराने JavaCompile release configuration को भी हटाएं
            sed -i '/options\.release\.set(.*)/d' "$BUILD_FILE"

            echo ""
            echo "Java release configuration cleaned."

          else
            echo "WARNING: app/build.gradle.kts नहीं मिला।"
          fi

      # --------------------------------------------------
      # 8. Show Gradle Project
      # --------------------------------------------------
      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      # --------------------------------------------------
      # 9. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Starting Gradle Build"
          echo "======================================"

          gradle --version

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      # --------------------------------------------------
      # 10. Find APK
      # --------------------------------------------------
      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for APK..."
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK generate नहीं हुई।"
            exit 1
          fi

          echo ""
          echo "APK Found:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 11. Rename APK
      # --------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release-apk

          cp "$APK_FILE" \
            "release-apk/ShikshaRojgar-App.apk"

          echo "Final APK:"
          ls -lh release-apk/ShikshaRojgar-App.apk

      # --------------------------------------------------
      # 12. Upload APK Artifact
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaRojgar-APK
          path: release-apk/ShikshaRojgar-App.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 13. Build Summary
      # --------------------------------------------------
      - name: Build Summary
        shell: bash
        run: |
          echo "======================================"
          echo "Shiksha Rojgar APK BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "APK:"
          echo "ShikshaRojgar-App.apk"
          echo ""
          echo "Artifact:"
          echo "ShikshaRojgar-APK"
          echo ""
          echo "Build completed successfully."
