name: Shiksha Rojgar APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # ==================================================
      # 2. JAVA 17
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. GRADLE 8.9
      # ==================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ==================================================
      # 4. FIND AND EXTRACT ZIP
      # ==================================================
      - name: Extract Shiksha Rojgar project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINDING SHIKSHA ROJGAR ZIP"
          echo "======================================"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -type f \
            -name "ShikshaRojgarApp*.zip" \
            | sort -V \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ShikshaRojgarApp ZIP नहीं मिला।"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted-project"

          mkdir -p "$GITHUB_WORKSPACE/extracted-project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted-project"

          echo "ZIP extraction completed."


      # ==================================================
      # 5. LOCATE ANDROID PROJECT
      # ==================================================
      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING ANDROID PROJECT"
          echo "======================================"

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted-project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle नहीं मिला।"

            find "$GITHUB_WORKSPACE/extracted-project" \
              -maxdepth 6 -type f | head -n 300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Settings file:"
          echo "$SETTINGS_FILE"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          BUILD_FILE=$(find "$PROJECT_DIR" \
            -maxdepth 2 \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle नहीं मिला।"
            exit 1
          fi

          echo "Build file:"
          echo "$BUILD_FILE"

          # IMPORTANT:
          # Absolute path save किया जा रहा है।
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 6. CHECK SIGNING SECRETS
      # ==================================================
      - name: Check permanent signing secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          echo "======================================"
          echo "CHECKING SIGNING SECRETS"
          echo "======================================"

          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "ERROR: SIGNING_KEYSTORE_BASE64 missing"
            exit 1
          fi

          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "ERROR: SIGNING_STORE_PASSWORD missing"
            exit 1
          fi

          if [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "ERROR: SIGNING_KEY_ALIAS missing"
            exit 1
          fi

          echo "SIGNING_KEYSTORE_BASE64 : PRESENT"
          echo "SIGNING_STORE_PASSWORD  : PRESENT"
          echo "SIGNING_KEY_ALIAS       : PRESENT"


      # ==================================================
      # 7. DECODE PERMANENT KEYSTORE
      # ==================================================
      - name: Decode permanent signing keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          echo "======================================"
          echo "DECODING PERMANENT KEYSTORE"
          echo "======================================"

          KEYSTORE_FILE="$RUNNER_TEMP/shiksharojgar-release.jks"

          printf '%s' "$SIGNING_KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            > "$RUNNER_TEMP/keystore.b64"

          BASE64_LENGTH=$(wc -c < "$RUNNER_TEMP/keystore.b64")

          echo "Base64 length: $BASE64_LENGTH"

          if [ "$BASE64_LENGTH" -eq 0 ]; then
            echo "ERROR: Base64 secret खाली है।"
            exit 1
          fi

          REMAINDER=$((BASE64_LENGTH % 4))

          if [ "$REMAINDER" -eq 1 ]; then
            echo "ERROR: Base64 secret truncated या corrupt है।"
            exit 1
          fi

          if [ "$REMAINDER" -eq 2 ]; then
            printf '==' >> "$RUNNER_TEMP/keystore.b64"
          elif [ "$REMAINDER" -eq 3 ]; then
            printf '=' >> "$RUNNER_TEMP/keystore.b64"
          fi

          base64 --decode \
            "$RUNNER_TEMP/keystore.b64" \
            > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore decode नहीं हुआ।"
            exit 1
          fi

          echo "Keystore decoded successfully."

          echo "Verifying permanent signing key..."

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            > "$RUNNER_TEMP/keystore-check.txt"

          echo "Permanent signing key verified."

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"


      # ==================================================
      # 8. CREATE SIGNING INIT SCRIPT
      # ABSOLUTE PATH
      # ==================================================
      - name: Create permanent signing configuration
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          SIGNING_SCRIPT="$GITHUB_WORKSPACE/permanent-signing.init.gradle"

          cat > "$SIGNING_SCRIPT" <<'EOF'
          allprojects {
              afterEvaluate { project ->

                  if (project.hasProperty("android")) {

                      project.android {

                          signingConfigs {
                              permanentRelease {
                                  storeFile = new File(
                                      System.getenv("KEYSTORE_FILE")
                                  )

                                  storePassword =
                                      System.getenv("SIGNING_STORE_PASSWORD")

                                  keyAlias =
                                      System.getenv("SIGNING_KEY_ALIAS")

                                  keyPassword =
                                      System.getenv("SIGNING_STORE_PASSWORD")
                              }
                          }

                          buildTypes {
                              release {
                                  signingConfig =
                                      signingConfigs.permanentRelease
                              }
                          }
                      }
                  }
              }
          }
          EOF

          echo "Signing script:"
          echo "$SIGNING_SCRIPT"

          test -f "$SIGNING_SCRIPT"

          echo "SIGNING_SCRIPT=$SIGNING_SCRIPT" >> "$GITHUB_ENV"


      # ==================================================
      # 9. BUILD RELEASE APK
      # ==================================================
      - name: Build signed Release APK
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          SIGNING_SCRIPT: ${{ env.SIGNING_SCRIPT }}
        run: |
          set -e

          echo "======================================"
          echo "BUILDING SHIKSHA ROJGAR RELEASE APK"
          echo "======================================"

          echo "Project:"
          echo "$PROJECT_DIR"

          echo "Signing script:"
          echo "$SIGNING_SCRIPT"

          test -f "$SIGNING_SCRIPT"

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Running Gradle 8.9..."

          gradle \
            -I "$SIGNING_SCRIPT" \
            clean \
            assembleRelease \
            --stacktrace \
            --no-daemon


      # ==================================================
      # 10. FIND APK
      # ==================================================
      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING RELEASE APK"
          echo "======================================"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | grep -i "release" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK नहीं मिला।"

            echo "Available APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk"

            exit 1
          fi

          echo "Release APK found:"
          echo "$APK"

          cp "$APK" \
            "$RUNNER_TEMP/ShikshaRojgar-Permanent-Signed.apk"


      # ==================================================
      # 11. VERIFY APK SIGNATURE
      # ==================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING APK SIGNATURE"
          echo "======================================"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner नहीं मिला।"
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$RUNNER_TEMP/ShikshaRojgar-Permanent-Signed.apk"

          echo "APK signature verification SUCCESSFUL."


      # ==================================================
      # 12. APK INFORMATION
      # ==================================================
      - name: Show final APK information
        shell: bash
        run: |
          echo "======================================"
          echo "FINAL SHIKSHA ROJGAR APK"
          echo "======================================"

          ls -lh \
            "$RUNNER_TEMP/ShikshaRojgar-Permanent-Signed.apk"

          echo "APK SHA-256:"
          sha256sum \
            "$RUNNER_TEMP/ShikshaRojgar-Permanent-Signed.apk"


      # ==================================================
      # 13. UPLOAD APK
      # ==================================================
      - name: Upload permanent signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaRojgar-Permanent-Signed-Release
          path: ${{ runner.temp }}/ShikshaRojgar-Permanent-Signed.apk
          if-no-files-found: error
          retention-days: 30


      # ==================================================
      # 14. CLEANUP
      # ==================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/shiksharojgar-release.jks"
          rm -f "$RUNNER_TEMP/keystore.b64"
          rm -f "$RUNNER_TEMP/keystore-check.txt"
          rm -f "$GITHUB_WORKSPACE/permanent-signing.init.gradle"
