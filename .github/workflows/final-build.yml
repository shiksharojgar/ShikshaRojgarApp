name: Shiksha Rojgar APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Shiksha Rojgar APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. Gradle 8.9
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ==========================================
      # 4. Find latest Shiksha Rojgar ZIP
      # ==========================================
      - name: Find Project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING SHIKSHA ROJGAR PROJECT ZIP"
          echo "=========================================="

          find . -maxdepth 3 -type f \
            -iname "ShikshaRojgarApp*.zip" \
            ! -iname "*apk-install*" \
            -print

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "ShikshaRojgarApp*.zip" \
            ! -iname "*apk-install*" \
            -print | sort -V | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Shiksha Rojgar ZIP नहीं मिली।"
            exit 1
          fi

          echo ""
          echo "ZIP SELECTED:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 5. Extract Project
      # ==========================================
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo ""
          echo "PROJECT EXTRACTED"

          find android-project -maxdepth 3 -type f | head -100

      # ==========================================
      # 6. Locate Gradle Project
      # ==========================================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          PROJECT_DIR=$(find android-project \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find android-project \
              -type f \
              -name "settings.gradle" \
              -print \
              | head -n 1 \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project नहीं मिला।"
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo ""
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. Decode Permanent Keystore
      # ==========================================
      - name: Setup Permanent Signing Keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "=========================================="
          echo "SETTING UP PERMANENT SIGNING"
          echo "=========================================="

          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "ERROR: SIGNING_KEYSTORE_BASE64 secret नहीं मिला।"
            exit 1
          fi

          KEYSTORE_FILE="$PROJECT_DIR/shiksharojgar-release.jks"

          printf '%s' "$SIGNING_KEYSTORE_BASE64" \
  | tr -d '[:space:]' \
  | base64 --decode > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          echo "Permanent keystore तैयार है।"

          ls -lh "$KEYSTORE_FILE"

      # ==========================================
      # 8. Create Gradle Signing Configuration
      # ==========================================
      - name: Configure Release Signing
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          INIT_SCRIPT="$PROJECT_DIR/permanent-signing.init.gradle"

          cat > "$INIT_SCRIPT" <<'EOF'
          allprojects {
              afterEvaluate { project ->

                  if (project.plugins.hasPlugin("com.android.application")) {

                      def android = project.extensions.getByName("android")

                      def signingConfigs = android.signingConfigs

                      def releaseSigning =
                          signingConfigs.findByName("release")

                      if (releaseSigning == null) {
                          releaseSigning =
                              signingConfigs.create("release")
                      }

                      releaseSigning.storeFile =
                          project.file(
                              System.getenv("SHIKSHA_KEYSTORE_FILE")
                          )

                      releaseSigning.storePassword =
                          System.getenv("SIGNING_STORE_PASSWORD")

                      releaseSigning.keyAlias =
                          System.getenv("SIGNING_KEY_ALIAS")

                      /*
                       * PKCS12 keystore में key password
                       * store password के समान है।
                       */
                      releaseSigning.keyPassword =
                          System.getenv("SIGNING_STORE_PASSWORD")

                      android.buildTypes
                          .getByName("release")
                          .signingConfig = releaseSigning

                      /*
                       * Automatic versionCode.
                       *
                       * हर GitHub Actions run को नया versionCode मिलेगा।
                       */
                      def runNumber =
                          (System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                              .toInteger()

                      def automaticVersionCode =
                          1000 + runNumber

                      android.defaultConfig.versionCode =
                          automaticVersionCode

                      println(
                          "Shiksha Rojgar automatic versionCode = "
                          + automaticVersionCode
                      )
                  }
              }
          }
          EOF

          echo "Gradle permanent signing configuration तैयार है।"

      # ==========================================
      # 9. Verify Project
      # ==========================================
      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID PROJECT CHECK"
          echo "=========================================="

          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      # ==========================================
      # 10. Build SIGNED RELEASE APK
      # ==========================================
      - name: Build Signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          SHIKSHA_KEYSTORE_FILE: ${{ env.PROJECT_DIR }}/shiksharojgar-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING SIGNED RELEASE APK"
          echo "=========================================="

          java -version

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Building release APK..."

          gradle clean assembleRelease \
            -I "$PROJECT_DIR/permanent-signing.init.gradle" \
            --stacktrace \
            --no-daemon \
            --console=plain

      # ==========================================
      # 11. Find RELEASE APK
      # ==========================================
      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING RELEASE APK"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: Signed release APK generate नहीं हुई।"
            exit 1
          fi

          echo ""
          echo "RELEASE APK FOUND:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 12. Verify APK Signature
      # ==========================================
      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner नहीं मिला।"
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$APK_FILE"

          echo ""
          echo "CERTIFICATE INFORMATION:"
          "$APKSIGNER" verify \
            --print-certs \
            "$APK_FILE"

          echo ""
          echo "APK SIGNATURE VERIFIED SUCCESSFULLY."

      # ==========================================
      # 13. Prepare Final APK
      # ==========================================
      - name: Prepare Release APK
        shell: bash
        run: |
          set -e

          mkdir -p release-apk

          cp "$APK_FILE" \
            "release-apk/ShikshaRojgar-App.apk"

          echo ""
          echo "FINAL SIGNED APK:"
          ls -lh release-apk/ShikshaRojgar-App.apk

      # ==========================================
      # 14. Upload APK
      # ==========================================
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaRojgar-APK
          path: release-apk/ShikshaRojgar-App.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 15. Success
      # ==========================================
      - name: Build Success
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " SHIKSHA ROJGAR SIGNED APK BUILD SUCCESS "
          echo "=========================================="
          echo ""
          echo "APK: ShikshaRojgar-App.apk"
          echo "Artifact: ShikshaRojgar-APK"
          echo ""
          echo "Permanent signing: ENABLED"
          echo "Release build: ENABLED"
          echo "Automatic versionCode: ENABLED"
          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY!"

      # ==========================================
      # 16. Cleanup
      # ==========================================
      - name: Cleanup Signing Files
        if: always()
        shell: bash
        run: |
          rm -f "$PROJECT_DIR/shiksharojgar-release.jks"
          rm -f "$PROJECT_DIR/permanent-signing.init.gradle"
