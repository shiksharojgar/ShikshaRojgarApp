name: Shiksha Rojgar APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Shiksha Rojgar APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ==========================================
      # 4. FIND PROJECT ZIP
      # ==========================================
      - name: Find Project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING PROJECT ZIP"
          echo "=========================================="

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "ShikshaRojgarApp*.zip" \
            ! -iname "*apk-install*" \
            -print | sort -V | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Shiksha Rojgar ZIP नहीं मिली।"
            echo ""
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 5. EXTRACT PROJECT
      # ==========================================
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          echo "Extracting project..."

          unzip -q "$ZIP_FILE" -d android-project

          echo ""
          echo "Extraction completed."

          find android-project -maxdepth 3 -type f | head -100

      # ==========================================
      # 6. LOCATE GRADLE PROJECT
      # ==========================================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          PROJECT_DIR=$(find android-project \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find android-project \
              -type f \
              -name "settings.gradle" \
              -print \
              | head -n 1 \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle Android project नहीं मिला।"
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo ""
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. CHECK SIGNING SECRETS
      # ==========================================
      - name: Check Signing Secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING SIGNING SECRETS"
          echo "=========================================="

          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "ERROR: SIGNING_KEYSTORE_BASE64 नहीं मिला।"
            exit 1
          fi

          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "ERROR: SIGNING_STORE_PASSWORD नहीं मिला।"
            exit 1
          fi

          if [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "ERROR: SIGNING_KEY_ALIAS नहीं मिला।"
            exit 1
          fi

          echo "SIGNING_KEYSTORE_BASE64 : PRESENT"
          echo "SIGNING_STORE_PASSWORD  : PRESENT"
          echo "SIGNING_KEY_ALIAS       : $SIGNING_KEY_ALIAS"

      # ==========================================
      # 8. DECODE PERMANENT KEYSTORE
      # ==========================================
      - name: Setup Permanent Signing Keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "=========================================="
          echo "SETTING UP PERMANENT SIGNING"
          echo "=========================================="

          KEYSTORE_FILE="$PROJECT_DIR/shiksharojgar-release.jks"

          echo "Preparing Base64 data..."

          # केवल valid Base64 characters रखें।
          CLEAN_BASE64=$(printf '%s' "$SIGNING_KEYSTORE_BASE64" \
            | tr -cd 'A-Za-z0-9+/=')

          if [ -z "$CLEAN_BASE64" ]; then
            echo "ERROR: Base64 data खाली है।"
            exit 1
          fi

          # Base64 padding check
          REMAINDER=$(( ${#CLEAN_BASE64} % 4 ))

          if [ "$REMAINDER" -eq 1 ]; then
            echo ""
            echo "ERROR: Base64 data corrupt या truncated है।"
            echo ""
            echo "GitHub Secret SIGNING_KEYSTORE_BASE64"
            echo "की पूरी value दोबारा paste करनी होगी।"
            exit 1
          fi

          if [ "$REMAINDER" -eq 2 ]; then
            CLEAN_BASE64="${CLEAN_BASE64}=="
          fi

          if [ "$REMAINDER" -eq 3 ]; then
            CLEAN_BASE64="${CLEAN_BASE64}="
          fi

          echo "Decoding permanent keystore..."

          printf '%s' "$CLEAN_BASE64" \
            | base64 --decode > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file खाली है।"
            exit 1
          fi

          echo ""
          echo "Permanent keystore decoded successfully."

          ls -lh "$KEYSTORE_FILE"

      # ==========================================
      # 9. VERIFY KEYSTORE
      # ==========================================
      - name: Verify Signing Keystore
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING KEYSTORE"
          echo "=========================================="

          keytool -list \
            -keystore "$PROJECT_DIR/shiksharojgar-release.jks" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            > /tmp/keystore-check.txt

          echo ""
          echo "KEYSTORE VERIFIED SUCCESSFULLY."
          echo "Alias: $SIGNING_KEY_ALIAS"

      # ==========================================
      # 10. CREATE SIGNING CONFIG
      # ==========================================
      - name: Configure Release Signing
        shell: bash
        run: |
          set -e

          INIT_SCRIPT="$PROJECT_DIR/permanent-signing.init.gradle"

          cat > "$INIT_SCRIPT" <<'EOF'
          allprojects {
              afterEvaluate { project ->

                  if (project.plugins.hasPlugin("com.android.application")) {

                      def android =
                          project.extensions.getByName("android")

                      def signingConfigs =
                          android.signingConfigs

                      def releaseSigning =
                          signingConfigs.findByName("release")

                      if (releaseSigning == null) {
                          releaseSigning =
                              signingConfigs.create("release")
                      }

                      releaseSigning.storeFile =
                          project.file(
                              System.getenv(
                                  "SHIKSHA_KEYSTORE_FILE"
                              )
                          )

                      releaseSigning.storePassword =
                          System.getenv(
                              "SIGNING_STORE_PASSWORD"
                          )

                      releaseSigning.keyAlias =
                          System.getenv(
                              "SIGNING_KEY_ALIAS"
                          )

                      /*
                       * हमारे PKCS12 keystore में
                       * key password और store password
                       * समान हैं।
                       */
                      releaseSigning.keyPassword =
                          System.getenv(
                              "SIGNING_STORE_PASSWORD"
                          )

                      android.buildTypes
                          .getByName("release")
                          .signingConfig =
                              releaseSigning

                      /*
                       * Automatic versionCode
                       */
                      def runNumber =
                          (
                              System.getenv(
                                  "GITHUB_RUN_NUMBER"
                              ) ?: "1"
                          ).toInteger()

                      def automaticVersionCode =
                          1000 + runNumber

                      android.defaultConfig.versionCode =
                          automaticVersionCode

                      println(
                          "=========================================="
                      )

                      println(
                          "SHIKSHA ROJGAR VERSION CODE = "
                          + automaticVersionCode
                      )

                      println(
                          "PERMANENT SIGNING = ENABLED"
                      )

                      println(
                          "=========================================="
                      )
                  }
              }
          }
          EOF

          echo ""
          echo "Release signing configuration created."

      # ==========================================
      # 11. VERIFY PROJECT
      # ==========================================
      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID PROJECT CHECK"
          echo "=========================================="

          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"

          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      # ==========================================
      # 12. BUILD RELEASE APK
      # ==========================================
      - name: Build Signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          SHIKSHA_KEYSTORE_FILE: ${{ env.PROJECT_DIR }}/shiksharojgar-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING SIGNED RELEASE APK"
          echo "=========================================="

          java -version

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Starting Gradle release build..."

          gradle clean assembleRelease \
            -I "$PROJECT_DIR/permanent-signing.init.gradle" \
            --stacktrace \
            --no-daemon \
            --console=plain

          echo ""
          echo "RELEASE BUILD COMPLETED."

      # ==========================================
      # 13. FIND APK
      # ==========================================
      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING RELEASE APK"
          echo "=========================================="

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: Release APK नहीं मिली।"
            exit 1
          fi

          echo ""
          echo "RELEASE APK FOUND:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 14. VERIFY APK SIGNATURE
      # ==========================================
      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner नहीं मिला।"
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$APK_FILE"

          echo ""
          echo "=========================================="
          echo "APK CERTIFICATE"
          echo "=========================================="

          "$APKSIGNER" verify \
            --print-certs \
            "$APK_FILE"

          echo ""
          echo "=========================================="
          echo "APK SIGNATURE VERIFIED SUCCESSFULLY"
          echo "=========================================="

      # ==========================================
      # 15. PREPARE APK
      # ==========================================
      - name: Prepare Release APK
        shell: bash
        run: |
          set -e

          mkdir -p release-apk

          cp "$APK_FILE" \
            "release-apk/ShikshaRojgar-App.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh release-apk/ShikshaRojgar-App.apk

      # ==========================================
      # 16. UPLOAD APK
      # ==========================================
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaRojgar-APK
          path: release-apk/ShikshaRojgar-App.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 17. SUCCESS
      # ==========================================
      - name: Build Success
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " SHIKSHA ROJGAR BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Release APK       : YES"
          echo "Permanent Signing : YES"
          echo "VersionCode       : AUTOMATIC"
          echo "Signature Verify  : PASSED"
          echo ""
          echo "APK: ShikshaRojgar-App.apk"
          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY!"
          echo "=========================================="

      # ==========================================
      # 18. CLEANUP
      # ==========================================
      - name: Cleanup Signing Files
        if: always()
        shell: bash
        run: |
          rm -f "$PROJECT_DIR/shiksharojgar-release.jks"
          rm -f "$PROJECT_DIR/permanent-signing.init.gradle"
