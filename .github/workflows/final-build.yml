name: Shiksha Rojgar APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: shiksha-rojgar

jobs:
  build:
    name: Build Signed APK + Firebase
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout actual GitHub source
      # ---------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ---------------------------------------------------------
      # 2. Setup Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. Setup Gradle
      # ---------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ---------------------------------------------------------
      # 4. Verify actual Android project
      # ---------------------------------------------------------
      - name: Verify Android Project
        shell: bash
        run: |
          set -euo pipefail

          echo "===== PROJECT ROOT ====="
          pwd
          ls -la

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "===== VERIFY APPLICATION ID ====="
          grep -q 'applicationId = "com.shiksharojgar.app"' app/build.gradle.kts

          echo "===== VERIFY GRADLE WRAPPER ====="
          test -f gradlew

          chmod +x gradlew

          echo "===== PROJECT VERIFIED ====="
          echo "Building directly from GitHub source."
          echo "ZIP extraction is NOT used."

      # ---------------------------------------------------------
      # 5. Check permanent signing secrets
      # ---------------------------------------------------------
      - name: Check Permanent Signing Secrets
        shell: bash
        env:
          KEYSTORE_B64_A: ${{ secrets.SHIKSHA_KEYSTORE_B64 }}
          STORE_PASSWORD_A: ${{ secrets.SHIKSHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS_A: ${{ secrets.SHIKSHA_KEY_ALIAS }}
          KEY_PASSWORD_A: ${{ secrets.SHIKSHA_KEY_PASSWORD }}

          KEYSTORE_B64_B: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD_B: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS_B: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD_B: ${{ secrets.SIGNING_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          KEYSTORE_B64="${KEYSTORE_B64_A:-${KEYSTORE_B64_B:-}}"
          STORE_PASSWORD="${STORE_PASSWORD_A:-${STORE_PASSWORD_B:-}}"
          KEY_ALIAS="${KEY_ALIAS_A:-${KEY_ALIAS_B:-}}"
          KEY_PASSWORD="${KEY_PASSWORD_A:-${KEY_PASSWORD_B:-}}"

          test -n "$KEYSTORE_B64" || {
            echo "ERROR: Keystore Base64 secret missing."
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "ERROR: Keystore password missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: Key alias missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: Key password missing."
            exit 1
          }

          echo "Decoding permanent keystore..."

          printf '%s' "$KEYSTORE_B64" \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            > "$RUNNER_TEMP/shiksha-release.jks"

          test -s "$RUNNER_TEMP/shiksha-release.jks"

          echo "Checking keystore..."

          keytool -list \
            -keystore "$RUNNER_TEMP/shiksha-release.jks" \
            -storepass "$STORE_PASSWORD" \
            >/dev/null

          echo "Permanent keystore verified successfully."

          echo "KEYSTORE_FILE=$RUNNER_TEMP/shiksha-release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 6. Build directly from current GitHub source
      # ---------------------------------------------------------
      - name: Build Signed Release APK
        shell: bash
        env:
          SHIKSHA_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          SHIKSHA_KEYSTORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          SHIKSHA_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          SHIKSHA_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "===== GRADLE VERSION ====="
          ./gradlew --version

          echo "===== CLEAN BUILD ====="

          ./gradlew clean :app:assembleRelease \
            --stacktrace \
            --no-daemon \
            --console=plain

      # ---------------------------------------------------------
      # 7. Verify APK
      # ---------------------------------------------------------
      - name: Verify APK Exists
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          echo "===== APK CREATED ====="
          ls -lh "$APK"

      # ---------------------------------------------------------
      # 8. Verify APK application ID
      # ---------------------------------------------------------
      - name: Verify APK Package
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aapt \
            | sort -V \
            | tail -n 1)

          test -n "$AAPT"

          echo "===== APK PACKAGE ====="

          "$AAPT" dump badging "$APK" \
            | grep "package: name='com.shiksharojgar.app'"

      # ---------------------------------------------------------
      # 9. Verify permanent APK signature
      # ---------------------------------------------------------
      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          test -n "$APKSIGNER"

          echo "===== SIGNATURE ====="

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

      # ---------------------------------------------------------
      # 10. Show APK information
      # ---------------------------------------------------------
      - name: Show APK Information
        shell: bash
        run: |
          echo "=========================================="
          echo "       SHIKSHA ROJGAR APK READY"
          echo "=========================================="
          echo "Package : com.shiksharojgar.app"
          echo "APK     : app/build/outputs/apk/release/app-release.apk"
          echo "=========================================="

          ls -lh app/build/outputs/apk/release/app-release.apk

      # ---------------------------------------------------------
      # 11. Upload signed APK
      # ---------------------------------------------------------
      - name: Upload Permanent Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiksha-Rojgar-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 12. Firebase Rules + Hosting
      # ---------------------------------------------------------
      - name: Deploy Firestore Rules + Hosting
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Firebase service account not configured."
            echo "Firebase deploy skipped."
            exit 0
          fi

          if [ ! -d "firebase" ]; then
            echo "firebase directory not found."
            echo "Firebase deploy skipped."
            exit 0
          fi

          echo "$FIREBASE_SERVICE_ACCOUNT" \
            > "$RUNNER_TEMP/firebase.json"

          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"

          npm install --global firebase-tools

          cd firebase

          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:rules,hosting \
            --non-interactive \
            || echo "Firebase Rules/Hosting deploy failed. APK remains successful."

      # ---------------------------------------------------------
      # 13. Firebase Cloud Functions
      # ---------------------------------------------------------
      - name: Deploy FCM Cloud Functions
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Firebase service account not configured."
            echo "Functions deploy skipped."
            exit 0
          fi

          if [ ! -d "firebase" ]; then
            echo "firebase directory not found."
            echo "Functions deploy skipped."
            exit 0
          fi

          echo "$FIREBASE_SERVICE_ACCOUNT" \
            > "$RUNNER_TEMP/firebase.json"

          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"

          npm install --global firebase-tools

          cd firebase

          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only functions \
            --non-interactive \
            || echo "Functions deployment skipped."

      # ---------------------------------------------------------
      # 14. Cleanup
      # ---------------------------------------------------------
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/shiksha-release.jks"
          rm -f "$RUNNER_TEMP/firebase.json"

          echo "Cleanup completed."
