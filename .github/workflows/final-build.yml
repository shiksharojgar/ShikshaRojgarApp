      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Shiksha Rojgar project ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -name "ShikshaRojgarApp*.zip" \
            | sort -V \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ShikshaRojgarApp ZIP नहीं मिला।"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          echo "ZIP extracted."

          PROJECT_DIR=""

          if [ -f "extracted-project/settings.gradle" ] || \
             [ -f "extracted-project/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted-project"
          else
            PROJECT_DIR=$(find extracted-project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print \
              | head -n 1 \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: ZIP के अंदर Android Gradle project नहीं मिला।"
            find extracted-project -maxdepth 4 -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \)
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
