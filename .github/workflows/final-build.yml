name: Shiksha Rojgar APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Shiksha Rojgar APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. Gradle 8.9
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ==========================================
      # 4. Find Shiksha Rojgar ZIP
      # ==========================================
      - name: Find Project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching for Android Project ZIP"
          echo "=========================================="

          find . -maxdepth 3 -type f -iname "*.zip" -print

          ZIP_FILE=""

          if [ -f "./ShikshaRojgarApp-v1.4.0-final.zip" ]; then
            ZIP_FILE="./ShikshaRojgarApp-v1.4.0-final.zip"
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -iname "ShikshaRojgarApp*.zip" \
              | grep -v "apk-install" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Shiksha Rojgar ZIP नहीं मिली।"
            echo ""
            find . -maxdepth 3 -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 5. Extract ZIP
      # ==========================================
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          echo "Extracting project..."

          unzip -q "$ZIP_FILE" -d android-project

          echo ""
          echo "Extraction completed."

          find android-project -maxdepth 3 -type f | head -100

      # ==========================================
      # 6. Find Gradle Project
      # ==========================================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # settings.gradle.kts खोजें
          PROJECT_DIR=$(find android-project \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          # अगर नहीं मिला तो settings.gradle खोजें
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find android-project \
              -type f \
              -name "settings.gradle" \
              -print \
              | head -n 1 \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Gradle Android project नहीं मिला।"
            echo ""
            echo "Available Gradle files:"
            find android-project -type f \
              \( -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -print || true
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo ""
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. Remove Java --release 17 problem
      # ==========================================
      - name: Fix Java Configuration
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ -f "$BUILD_FILE" ]; then

            echo "Checking Android build.gradle.kts..."

            # पुराने problematic release option को हटाएं
            sed -i '/options\.release\.set(17)/d' "$BUILD_FILE"

            # कोई भी JavaCompile release setting हटाएं
            sed -i '/options\.release\.set(/d' "$BUILD_FILE"

            echo ""
            echo "Java configuration fixed."

          else
            echo ""
            echo "WARNING: app/build.gradle.kts नहीं मिला।"
          fi

      # ==========================================
      # 8. Verify Project
      # ==========================================
      - name: Verify Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID PROJECT CHECK"
          echo "=========================================="

          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      # ==========================================
      # 9. Build APK
      # ==========================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "STARTING ANDROID BUILD"
          echo "=========================================="

          java -version

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Building APK..."

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      # ==========================================
      # 10. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING GENERATED APK"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK generate नहीं हुई।"
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 11. Rename APK
      # ==========================================
      - name: Prepare Release APK
        shell: bash
        run: |
          set -e

          mkdir -p release-apk

          cp "$APK_FILE" \
            "release-apk/ShikshaRojgar-App.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh release-apk/ShikshaRojgar-App.apk

      # ==========================================
      # 12. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaRojgar-APK
          path: release-apk/ShikshaRojgar-App.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 13. Success
      # ==========================================
      - name: Build Success
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "     SHIKSHA ROJGAR APK BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK: ShikshaRojgar-App.apk"
          echo "Artifact: ShikshaRojgar-APK"
          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY!"
