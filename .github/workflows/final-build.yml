name: Final Shiksha Rojgar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Final Fixed APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check v4 project
        run: |
          echo "Checking v4 project..."

          if [ ! -f "ShikshaRojgarApp-Colorful-Fixed-v4.zip" ]; then
            echo "ERROR: v4 ZIP not found!"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "v4 project found."

      - name: Extract v4 project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "ShikshaRojgarApp-Colorful-Fixed-v4.zip" -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Java and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          gradle --version

      - name: Show Gradle configuration
        run: |
          echo "===== app/build.gradle.kts ====="
          cat "$PROJECT_DIR/app/build.gradle.kts"

      - name: Clean previous build
        run: |
          cd "$PROJECT_DIR"
          gradle clean --no-daemon

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Check APK
        run: |
          echo "Searching for generated APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          if [ ! -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: app-debug.apk was not generated!"
            exit 1
          fi

          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiksha-Rojgar-FINAL-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
